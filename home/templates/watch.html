<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ movie.name }} - Prime Video</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        .navbar {
            height: 65px;
            background: #111;
            display: flex;
            align-items: center;
            padding: 0 40px;
        }

        .logo {
            color: #00a8e1;
            font-size: 26px;
            font-weight: bold;
        }

        .back {
            margin-left: auto;
            color: white;
            text-decoration: none;
        }

        .container {
            padding: 40px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .video-container {
            width: 100%;
            max-width: 1000px;
            margin: auto;
        }

        iframe {
            width: 100%;
            height: 560px;
            border: none;
        }

        @media (max-width: 768px) {

            .container {
                padding: 20px;
            }

            iframe {
                height: 300px;
            }
        }

    </style>

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            prime video
        </div>

        <a href="{% url 'movie_detail' movie.id %}" class="back">
            ← Back
        </a>

    </nav>


    <div class="container">

        <h1>
            {{ movie.name }}
        </h1>

        <div class="video-container">

            <iframe
                src="{{ movie.trailer }}"
                allowfullscreen>
            </iframe>

        </div>

    </div>

</body>

</html>
