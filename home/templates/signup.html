<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Prime Video - Sign Up</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signup-box {
            width: 400px;
            background: #111;
            padding: 40px;
            border-radius: 8px;
        }

        .logo {
            text-align: center;
            color: #00a8e1;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;

            background: #222;
            border: 1px solid #444;

            color: white;

            border-radius: 4px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #00a8e1;
        }

        .signup-btn {
            width: 100%;
            padding: 13px;

            background: #00a8e1;
            color: white;

            border: none;
            border-radius: 4px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .signup-btn:hover {
            background: #0089b8;
        }

        .error {
            color: #ff4d4d;
            text-align: center;
            margin-bottom: 15px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
        }

        .login-link a {
            color: #00a8e1;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="signup-box">

        <div class="logo">
            prime video
        </div>

        <h1>
            Create Account
        </h1>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button
                type="submit"
                class="signup-btn"
            >
                Sign Up
            </button>

        </form>

        <div class="login-link">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>

    </div>

</body>

</html>
