<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Movie - Prime Video</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        .navbar {
            height: 65px;
            background: #111;
            display: flex;
            align-items: center;
            padding: 0 40px;
        }

        .logo {
            color: #00a8e1;
            font-size: 26px;
            font-weight: bold;
        }

        .back {
            margin-left: auto;
            color: white;
            text-decoration: none;
        }

        .container {
            width: 600px;
            max-width: 90%;
            margin: 40px auto;
            background: #111;
            padding: 35px;
            border-radius: 8px;
        }

        h1 {
            margin-bottom: 30px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #ddd;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #00a8e1;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: #00a8e1;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #0089b8;
        }

        .errorlist {
            color: #ff5555;
            margin-bottom: 5px;
        }

    </style>

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            prime video
        </div>

        <a href="{% url 'movies' %}" class="back">
            ← Back to Movies
        </a>

    </nav>


    <div class="container">

        <h1>Edit Movie</h1>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="submit-btn">
                Update Movie
            </button>

        </form>

    </div>

</body>

</html>
