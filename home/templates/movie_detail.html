<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ movie.name }} - Prime Video</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        .navbar {
            height: 65px;
            background: #111;
            display: flex;
            align-items: center;
            padding: 0 40px;
        }

        .logo {
            color: #00a8e1;
            font-size: 26px;
            font-weight: bold;
        }

        .back {
            margin-left: auto;
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .movie-detail {
            min-height: calc(100vh - 65px);
            padding: 60px;
            display: flex;
            gap: 50px;
            align-items: center;
        }

        .movie-image {
            width: 350px;
            height: 500px;
            object-fit: cover;
            border-radius: 5px;
        }

        .movie-content {
            max-width: 650px;
        }

        .movie-content h1 {
            font-size: 45px;
            margin-bottom: 20px;
        }

        .movie-info {
            color: #aaa;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .rating {
            color: #00a8e1;
            font-weight: bold;
        }

        .description {
            color: #ddd;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .watch-btn {
            display: inline-block;
            padding: 13px 28px;
            background: #00a8e1;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }

        .watch-btn:hover {
            background: #0089b8;
        }

        .trailer {
            margin-top: 35px;
        }

        .trailer h2 {
            margin-bottom: 15px;
        }

        iframe {
            width: 600px;
            height: 340px;
            border: none;
        }

        @media (max-width: 768px) {

            .movie-detail {
                padding: 30px 20px;
                flex-direction: column;
                align-items: flex-start;
            }

            .movie-image {
                width: 250px;
                height: 360px;
            }

            .movie-content h1 {
                font-size: 35px;
            }

            iframe {
                width: 100%;
                height: 250px;
            }
        }

    </style>

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            prime video
        </div>

        <a href="/" class="back">
            ← Back to Home
        </a>

    </nav>


    <div class="movie-detail">

        <img
            src="{{ movie.bannerUrl }}"
            alt="{{ movie.name }}"
            class="movie-image"
        >


        <div class="movie-content">

            <h1>
                {{ movie.name }}
            </h1>


            <div class="movie-info">

                {{ movie.genre }}
                &nbsp; | &nbsp;

                {{ movie.releaseYear }}
                &nbsp; | &nbsp;

                {{ movie.duration }}

                <br><br>

                <span class="rating">
                    ⭐ {{ movie.rating }}
                </span>

            </div>


            <p class="description">
                {{ movie.description }}
            </p>


            <p class="movie-info">
                <strong>Director:</strong>
                {{ movie.director }}
            </p>


            <p class="movie-info">
                <strong>Cast:</strong>
                {{ movie.cast }}
            </p>


           <a
                href="{% url 'watch_movie' movie.id %}"
                class="watch-btn"
                >
                ▶ Watch Now
           </a>


            <div class="trailer">

                <h2>Trailer</h2>

                <iframe
                    src="{{ movie.trailer }}"
                    allowfullscreen>
                </iframe>

            </div>

        </div>

    </div>

</body>

</html>
